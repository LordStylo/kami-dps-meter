<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Kami Overlay</title><link rel="stylesheet" href="style.css"><script type="module" src="renderer.js"></script></head>
<body><main id="panel">
<button id="launcher" aria-label="Arayüzü aç" title="Arayüz · Alt ile tıkla veya taşı" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
<header id="bar"><span class="mark">K</span><strong id="title">KAMI DPS</strong><span id="interaction">ALT</span><button id="settings" class="bar-button" title="Ayarlar" aria-label="Ayarlar" aria-expanded="false" aria-controls="settings-body" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 3-.7 2.4-2 .9L4 5.8 2 9l1.7 1.8v2.4L2 15l2 3.2 2.3-.5 2 .9L9 21h6l.7-2.4 2-.9 2.3.5 2-3.2-1.7-1.8v-2.4L22 9l-2-3.2-2.3.5-2-.9L15 3Z"/><circle cx="12" cy="12" r="3.2"/></svg></button><button id="collapse" class="bar-button" title="Küçült" aria-label="Küçült">−</button></header>
<section id="settings-body" aria-labelledby="settings-title" hidden><div class="settings-heading"><strong id="settings-title">Görünüm</strong><button id="settings-close" aria-label="Ayarları kapat" title="Ayarları kapat">×</button></div><label class="auto-hide-setting"><input id="auto-hide" type="checkbox" checked><span>Savaş dışında otomatik gizle</span></label><div class="setting-label"><label for="transparency">Arka plan şeffaflığı</label><output id="transparency-value" for="transparency">%8</output></div><input id="transparency" type="range" min="0" max="100" step="1" value="8" aria-describedby="transparency-help"><div class="range-labels"><span>Opak</span><span>Şeffaf</span></div><p id="transparency-help">Yazılar ve yetenek ikonları net kalır.</p><div class="settings-footer"><span>Otomatik kaydedilir</span><button id="appearance-reset">Varsayılana dön</button></div></section>
<section id="dps-body" hidden><div class="meter-toolbar"><div id="mode-tabs" role="group" aria-label="DPS modu"><button id="mode-party" aria-pressed="true" aria-label="Party mode" title="Party mode · Parti sıralaması">Parti</button><button id="mode-individual" aria-pressed="false" aria-label="Individual mode" title="Individual mode · Kendi yeteneklerim">Ben</button></div><div id="metric-tabs" role="group" aria-label="Ölçüm türü"><button id="metric-damage" aria-pressed="true">Hasar</button><button id="metric-healing" aria-pressed="false">İyileştirme</button></div></div><div class="summary"><div><small id="fight-label">PARTİ DPS</small><strong id="total-dps">—</strong></div><div class="totals"><span id="duration">00:00</span><small id="damage">0 hasar</small></div></div><div class="list-label"><button id="back" hidden>‹ Parti</button><span id="list-title">OYUNCULAR</span><span id="columns">DPS · PAY</span></div><div id="rows"></div><footer><span id="dps-status">Bağlanıyor</span><button id="dashboard" title="Ayrıntılı arayüzü aç">↗</button></footer></section>
<section id="cube-body" hidden><div class="cube-status"><i id="cube-led"></i><strong id="cube-status">Küp alarmı: Kapalı</strong></div><div class="cube-indicator"><span aria-hidden="true">◇</span><strong id="cube-count">0</strong><small>tespit edilen</small></div><p id="cube-detail">Başlat ile alarmı etkinleştir.</p><div class="cube-actions"><button id="cube-start">Başlat</button><button id="sound">Sesi dene</button><button id="mute" aria-pressed="false">Sessiz</button><button id="cube-stop" disabled>Durdur</button><button id="cube-hide">Gizle</button><span id="audio-state">Ses hazır değil</span></div></section>
<section id="controls-body" hidden><button id="toggle-dps" class="control-switch" role="switch" aria-checked="true" aria-label="DPS penceresi"><span><b>▥</b> DPS meter</span><span class="switch-state">Açık</span><i aria-hidden="true"></i></button><button id="show-dps" aria-pressed="false" title="Son savaşı aç; sonraki savaşta otomatik davranışa dön">DPS’yi göster</button><button id="toggle-cube" class="control-switch" role="switch" aria-checked="true" aria-label="Küp penceresi"><span><b>◇</b> Küp bildirimi</span><span class="switch-state">Açık</span><i aria-hidden="true"></i></button><p>Gizlemek ölçümü ve küp sesini durdurmaz.</p><button id="controls-close">Küçük kutuya dön</button></section>
<button id="resize-grip" tabindex="-1" aria-label="DPS penceresini boyutlandır" title="Alt basılıyken köşeden sürükleyerek boyutlandır" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 13 9-9M9 13l4-4"/></svg></button>
</main></body></html>
